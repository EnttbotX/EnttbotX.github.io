<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title id="site-title">Wiki — EnttbotX</title>
  <link id="site-favicon" rel="icon" href="https://www.spigotmc.org/data/avatars/s/1937/1937569.jpg?1725636356" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  
  <style>
    .gitbook-container {
      display: flex;
      margin-top: var(--header-h, 70px);
      min-height: calc(100vh - var(--header-h, 70px));
    }

    .wiki-sidebar {
      width: 280px;
      background: #111116;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.5rem;
      position: fixed;
      top: var(--header-h, 70px);
      bottom: 0;
      left: 0;
      overflow-y: auto;
    }

    .search-box {
      width: 100%;
      padding: 0.5rem 0.8rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #16161c;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
    }

    .sidebar-menu { list-style: none; padding: 0; margin: 0; }
    .sidebar-title { color: var(--text-muted, #888); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; font-weight: 700; }
    
    .sidebar-item { margin-bottom: 0.3rem; }
    .sidebar-link {
      display: block; padding: 0.4rem 0.7rem; color: #ccc; text-decoration: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; transition: 0.2s;
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: rgba(0, 123, 255, 0.15); color: #007bff; font-weight: 500;
    }

    .wiki-content {
      margin-left: 280px;
      flex: 1;
      padding: 3rem;
      max-width: 900px;
    }

    .sub-block {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 4px solid #007bff;
      padding: 1.5rem;
      border-radius: 0 8px 8px 0;
      margin-top: 1.5rem;
    }
    .sub-block h4 { font-family: 'Space Grotesk', sans-serif; font-size: 1.2rem; color: #fff; margin-bottom: 0.5rem; }
    .sub-block .text-content { color: #b3b3b3; line-height: 1.6; font-size: 0.95rem; }

    .code-container {
      background: #1e1e24;
      border-radius: 8px;
      margin: 1rem 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #282a36;
      padding: 0.4rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .code-lang {
      color: #a2a2ca;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid #555;
      color: #ccc;
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .copy-btn:hover {
      background: #444;
      color: #fff;
    }
    .code-container pre {
      margin: 0;
      padding: 1rem;
      overflow-x: auto;
    }
    .code-container code {
      font-family: monospace;
      color: #f8f8f2;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .btn-container { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .btn-sm { padding: 0.3rem 0.8rem; font-size: 0.85rem; border-radius: 4px; text-decoration: none; display: inline-block; }

    /* ── Header banners (replace big plain text with an image/gradient header) ── */
    .wiki-banner {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
    }
    .wiki-banner.page-banner { height: 260px; }
    .wiki-banner.module-banner { height: 190px; margin-top: 0.5rem; margin-bottom: 1.5rem; }
    .wiki-banner img.banner-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .wiki-banner .banner-overlay {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 1.5rem 2rem;
      background: linear-gradient(to top, rgba(10,10,14,0.92) 10%, rgba(10,10,14,0.35) 70%, transparent 100%);
    }
    .wiki-banner .banner-title {
      font-family: 'Space Grotesk', sans-serif;
      color: #fff;
      margin: 0;
      font-weight: 700;
    }
    .wiki-banner.page-banner .banner-title { font-size: 2.4rem; }
    .wiki-banner.module-banner .banner-title { font-size: 1.7rem; }
    .wiki-banner .banner-sub {
      color: #d6d6de;
      margin: 0.4rem 0 0;
      font-size: 0.95rem;
      line-height: 1.5;
      max-width: 700px;
    }
    .sidebar-group-title {
      color: var(--text-muted, #888);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      margin: 1rem 0 0.4rem;
    }
    .sidebar-group-title:first-of-type { margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <nav class="header-nav">
      <ul>
        <li><a href="index.html#home" class="nav-link">Inicio</a></li>
        <li><a href="index.html#portfolio" class="nav-link">Portafolio</a></li>
      </ul>
    </nav>
    <a href="https://ko-fi.com/enttbot" target="_blank" class="kofi-link">
      <img src="https://cdn.prod.website-files.com/5c14e387dab576fe667689cf/670f5a01c01ea9191809398c_support_me_on_kofi_blue.png" alt="Support">
    </a>
  </header>

  <div class="gitbook-container">
    <aside class="wiki-sidebar">
      <select id="lang-select" class="search-box" onchange="changeLang()">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <input type="text" id="wiki-search" class="search-box" placeholder="Search module..." oninput="searchModules()">
      <div class="sidebar-title" id="lbl-modules">Modules</div>
      <ul id="sidebar-menu" class="sidebar-menu"></ul>
    </aside>

    <main class="wiki-content">
      <div class="hero" style="text-align: left; max-width: 100%; padding: 0;">
        <div id="page-banner"></div>

        <div id="active-module-content"></div>
      </div>
    </main>
  </div>

  <script>
    // currentApis: [{ id, category, name, header_image, description, translates, modules: [mod, ...] }]
    // currentModules: flattened modules, each carrying a back-reference to its parent api ( _api )
    let currentApis = [];
    let currentModules = [];
    let currentLang = 'en';

    function t(key, mod) {
      const dict = mod && (mod.translates || (mod._api && mod._api.translates));
      if (dict && dict[key] && dict[key][currentLang]) {
        return dict[key][currentLang];
      }
      return key;
    }

    // Deterministic hue from a string, used to build a fallback gradient
    // banner when a wiki/module doesn't define a header_image.
    function hashHue(str) {
      let hash = 0;
      for (let i = 0; i < (str || '').length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) % 360;
    }

    function renderBanner(el, { image, title, subtitle, seedKey, variant }) {
      el.className = `wiki-banner ${variant}`;
      el.innerHTML = '';

      if (image) {
        const img = document.createElement('img');
        img.className = 'banner-img';
        img.src = image;
        img.alt = title || '';
        el.appendChild(img);
      } else {
        const hue = hashHue(seedKey);
        el.style.background = `linear-gradient(135deg, hsl(${hue}, 65%, 22%), hsl(${(hue + 60) % 360}, 60%, 14%))`;
      }

      const overlay = document.createElement('div');
      overlay.className = 'banner-overlay';
      overlay.innerHTML = `
        <h2 class="banner-title">${title || ''}</h2>
        ${subtitle ? `<p class="banner-sub">${subtitle}</p>` : ''}
      `;
      el.appendChild(overlay);
    }

    function changeLang() {
      currentLang = document.getElementById('lang-select').value;

      document.getElementById('lbl-modules').innerText = currentLang === 'en' ? 'Modules' : 'Módulos';
      document.getElementById('wiki-search').placeholder = currentLang === 'en' ? 'Search module...' : 'Buscar módulo...';

      renderSidebar();
      const activeLink = document.querySelector('.sidebar-link.active');
      if (activeLink) {
        displayModuleContent(activeLink.dataset.moduleId);
      }
    }

    function formatTextWithCode(text) {
      if (!text) return "";
      const paragraphs = text.replace(/```(\w+)?\n([\s\S]*?)```/g, function(match, lang, code) {
        const escapedCode = code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const language = lang ? lang : 'code';
        const copyBtnText = currentLang === 'en' ? 'Copy' : 'Copiar';
        return `<div class="code-container"><div class="code-header"><span class="code-lang">${language}</span><button class="copy-btn" onclick="copyToClipboard(this)">${copyBtnText}</button></div><pre><code>${escapedCode}</code></pre></div>`;
      });
      return paragraphs.replace(/\n(?![^<]*>)/g, '<br>');
    }

    function copyToClipboard(button) {
      const codeContainer = button.parentElement.nextElementSibling;
      const codeText = codeContainer.innerText;

      navigator.clipboard.writeText(codeText).then(() => {
        const originalText = button.innerText;
        button.innerText = currentLang === 'en' ? "Copied!" : "¡Copiado!";
        button.style.borderColor = "#4ade80";
        button.style.color = "#4ade80";
        
        setTimeout(() => {
          button.innerText = originalText;
          button.style.borderColor = "";
          button.style.color = "";
        }, 2000);
      });
    }

    async function loadYamlConfig() {
      try {
        // wikies.yml is just an index: { category: [ "File.yml", ... ] }.
        // Each file under Wikies/ carries its own category/name/modules,
        // so adding a new wiki only means dropping one file here.
        const indexRes = await fetch('wikies.yml');
        if (!indexRes.ok) throw new Error('Could not load wikies.yml');
        const index = jsyaml.load(await indexRes.text()) || {};

        const fetchJobs = [];
        for (const category of Object.keys(index)) {
          const files = index[category];
          if (!files) continue;
          for (const file of files) {
            fetchJobs.push(
              fetch(`Wikies/${file}`)
                .then(r => r.text())
                .then(txt => {
                  const api = jsyaml.load(txt);
                  if (!api || !api.id) return null;
                  api.category = api.category || category;
                  return api;
                })
                .catch(() => null)
            );
          }
        }

        currentApis = (await Promise.all(fetchJobs)).filter(Boolean);

        // Flatten modules (numbered 1, 2, 3... in YAML) into a single list,
        // keeping a back-reference to the parent API for translations,
        // grouping and the fallback banner.
        currentModules = [];
        currentApis.forEach(api => {
          const modEntries = api.modules || {};
          const keys = Object.keys(modEntries).sort((a, b) => Number(a) - Number(b));
          api._orderedModules = keys.map(k => {
            const mod = modEntries[k];
            mod._api = api;
            currentModules.push(mod);
            return mod;
          });
        });

        renderSidebar();

        // Deep-link support: Wiki.html#EnttAPI opens that API's first
        // module, Wiki.html#inventory_api opens that module directly.
        const hash = decodeURIComponent(location.hash.replace('#', ''));
        const targetApi = currentApis.find(a => a.id === hash);
        const targetModule = currentModules.find(m => m.id === hash);

        if (targetModule) {
          displayModuleContent(targetModule.id);
        } else if (targetApi && targetApi._orderedModules.length) {
          displayModuleContent(targetApi._orderedModules[0].id);
        } else if (currentModules.length > 0) {
          displayModuleContent(currentModules[0].id);
        }
      } catch (error) {
        console.error(error);
        document.getElementById('active-module-content').innerHTML =
          `<h2 style="color:#fff;">Error 404</h2><p style="color:var(--text-muted);">Could not load YAML files.</p>`;
      }
    }

    function renderSidebar() {
      const sidebarMenu = document.getElementById('sidebar-menu');
      sidebarMenu.innerHTML = '';

      const activeLink = document.querySelector('.sidebar-link.active');
      const activeModuleId = activeLink ? activeLink.dataset.moduleId : null;

      currentApis.forEach((api, apiIdx) => {
        const groupLi = document.createElement('li');
        groupLi.innerHTML = `<div class="sidebar-group-title">${api.name}</div>`;
        sidebarMenu.appendChild(groupLi);

        api._orderedModules.forEach((mod, modIdx) => {
          const li = document.createElement('li');
          li.className = 'sidebar-item';

          const isActive = activeModuleId
            ? activeModuleId === mod.id
            : (apiIdx === 0 && modIdx === 0);

          const a = document.createElement('a');
          a.className = `sidebar-link ${isActive ? 'active' : ''}`;
          a.dataset.moduleId = mod.id;
          a.textContent = t(mod.title, mod);
          a.onclick = () => displayModuleContent(mod.id);
          li.appendChild(a);
          sidebarMenu.appendChild(li);
        });
      });

      searchModules();
    }

    function displayModuleContent(moduleId) {
      document.querySelectorAll('.sidebar-link').forEach(link =>
        link.classList.toggle('active', link.dataset.moduleId === moduleId)
      );

      const mod = currentModules.find(m => m.id === moduleId);
      if (!mod) return;
      const api = mod._api;

      // Page-level banner reflects the API the current module belongs to.
      renderBanner(document.getElementById('page-banner'), {
        image: api.header_image,
        title: api.name,
        subtitle: t(api.description, api),
        seedKey: api.id,
        variant: 'page-banner'
      });

      history.replaceState(null, '', `#${moduleId}`);

      const container = document.getElementById('active-module-content');
      container.innerHTML = '';

      const moduleBanner = document.createElement('div');
      container.appendChild(moduleBanner);
      renderBanner(moduleBanner, {
        image: mod.header_image,
        title: t(mod.title, mod),
        subtitle: t(mod.short_desc, mod),
        seedKey: mod.id,
        variant: 'module-banner'
      });

      const body = document.createElement('div');
      body.style.cssText = 'color:#e0e0e0; line-height:1.6; font-size:1.05rem;';
      body.innerHTML = formatTextWithCode(t(mod.content, mod));
      container.appendChild(body);

      const subArea = document.createElement('div');
      subArea.className = 'subsections-area';
      container.appendChild(subArea);

      if (mod.subsections) {
        mod.subsections.forEach((sub, idx) => {
          const subId = `sub-btn-container-${idx}`;
          const subBlock = document.createElement('div');
          subBlock.className = 'sub-block';
          subBlock.innerHTML = `
            <h4>${t(sub.title, mod)}</h4>
            <div class="text-content">${formatTextWithCode(t(sub.content, mod))}</div>
            <div class="btn-container" id="${subId}"></div>
          `;
          subArea.appendChild(subBlock);

          if (sub.buttons) {
            const btnContainer = subBlock.querySelector(`#${subId}`);
            sub.buttons.forEach(btn => {
              const a = document.createElement('a');
              a.href = btn.url;
              a.className = `btn btn-sm ${btn.class}`;
              a.innerText = btn.text;
              if (btn.url.startsWith('http')) a.target = "_blank";
              btnContainer.appendChild(a);
            });
          }
        });
      }
    }

    function searchModules() {
      const query = document.getElementById('wiki-search').value.toLowerCase();

      currentModules.forEach(mod => {
        let matchInSubs = false;
        if (mod.subsections) {
          matchInSubs = mod.subsections.some(s =>
            t(s.title, mod).toLowerCase().includes(query) ||
            t(s.content, mod).toLowerCase().includes(query)
          );
        }

        const matches = t(mod.title, mod).toLowerCase().includes(query) ||
                        t(mod.short_desc, mod).toLowerCase().includes(query) ||
                        matchInSubs;

        const sidebarLink = document.querySelector(`.sidebar-link[data-module-id="${mod.id}"]`);
        if (sidebarLink) {
          sidebarLink.parentElement.style.display = matches ? 'block' : 'none';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', loadYamlConfig);
    window.addEventListener('hashchange', () => {
      const hash = decodeURIComponent(location.hash.replace('#', ''));
      const targetModule = currentModules.find(m => m.id === hash);
      const targetApi = currentApis.find(a => a.id === hash);
      if (targetModule) displayModuleContent(targetModule.id);
      else if (targetApi && targetApi._orderedModules.length) displayModuleContent(targetApi._orderedModules[0].id);
    });
  </script>
</body>
</html>
